; ESP32 PlatformIO Configuration for PromoBeacon ESP32
; Build Environment: ESP-IDF Framework

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 57600
board_upload.require_upload_port = yes

; Force 4MB flash size to match hardware and suppress warnings
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_upload.maximum_ram_size = 327680

; Build flags for memory optimization and feature configuration
build_flags = 
    -Os
    -Wno-error
    -Wno-format
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-unused-but-set-variable

    -D CONFIG_WIFI_PROVIDED_SOFTAP=1
    -D CONFIG_LWIP_IPV4=1
    ; Enable NVS for configuration storage
    -D CONFIG_USE_NVS=1
    -D CONFIG_HTTPD_MAX_REQ_HDR_LEN=4096
    -D CONFIG_HTTPD_MAX_URI_LEN=2048
    -Os
    -Wno-error

; SDK Configuration defaults
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults sdkconfig.esp32

; Partition table configuration
board_build.partitions = partitions.csv

; Flash settings
board_build.flash_mode = dout
board_build.flash_freq = 40m

; Embedded files (HTML portal)
; NOTE: styles.css was removed — file does not exist (BUG-06 fix)
board_build.embed_txtfiles = 
    main/index.html

; Serial debug output
monitor_filters = esp32_exception_decoder

; NOTE: optimize_build.py does not exist — commented out to prevent build error (BUG-05 fix)
; extra_scripts = pre:scripts/optimize_build.py

[env:esp32s3]
platform = espressif32
board = esp32s3dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    ${env:esp32dev.build_flags}
    -D CONFIG_ESP32S3_DATA_CACHE_LINE_64B=1

board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.flash_freq = 80m

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
; upload_port = COM5
; monitor_port = COM5

build_flags = 
    ${env:esp32dev.build_flags}
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults sdkconfig.c3

board_build.flash_mode = dout
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.flash_freq = 40m

[platformio]
default_envs = esp32c3
src_dir = main
include_dir = include
lib_dir = lib
data_dir = data

[compatibility]
; Ensure consistent behavior across ESP-IDF versions
espidf.components = 
    esp_wifi
    esp_event
    tcpip_adapter
    nvs_flash
    esp_adc_cal
    driver

